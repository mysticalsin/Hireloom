name: hosted-saas-ci

on:
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'engine/llm/**'
      - 'tests/llm-provider.test.mjs'
      - '.github/workflows/ci-hosted.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'engine/llm/**'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/llm-provider.test.mjs

  edge-functions:
    # Deno-typechecks the edge functions (cannot be done in the JS engine env) and
    # runs the pure unit tests (entitlement twin). The supabase-start RLS/isolation
    # job is added with the pgTAP suite (Phase 1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: deno check supabase/functions/**/*.ts
      - name: Unit tests (entitlement twin, pure logic)
        run: deno test supabase/tests/

  rls-isolation:
    # Proves tenant isolation + the paywall lockdown (migration 0005) against a real
    # Postgres. This is the gate the audit demands before holding real user data/keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (applies migrations)
        run: supabase start
      - name: RLS isolation + paywall-lockdown proof
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql
      - name: Stop Supabase
        if: always()
        run: supabase stop
